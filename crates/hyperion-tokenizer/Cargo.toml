[package]
name = "hyperion-tokenizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The in-process tokenizer (M3, 03 §Sampling + 04:80-82). `tokenizers` IS the
# HuggingFace Rust backend transformers uses under the hood, so loading the 12B's
# tokenizer.json via it guarantees byte-identical encode/decode parity vs the
# oracle (no hand-rolled BPE / normalizer / added_tokens edge cases). Pure Rust
# (unsafe_code=deny).
tokenizers = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The chat-template renderer (M3). minijinja evaluates the gemma4
# `chat_template.jinja` in-process (no Python on the request path, 01:49). The
# gemma4 template calls dict `.get()` (line 239+) which minijinja's built-in
# map does NOT expose as a method; the renderer wraps every JSON map in a
# custom `Object` that dispatches `.get()`/`items()`/`keys()`/`values()` via
# `call_method` (see `renderer.rs`). Default features give us builtins (tests
# like `is mapping`, filters like `dictsort`, the `range`/`dict` functions),
# serde, and macros — all the gemma4 template relies on.
minijinja = "2.21"

[lints]
workspace = true
