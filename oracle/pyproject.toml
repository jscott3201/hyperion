[project]
name = "hyperion-oracle"
version = "0.0.0"
description = "Bench-only pinned mlx-lm oracle for Hyperion parity work"
requires-python = "==3.12.*"
dependencies = [
    "mlx==0.32.0",
    "mlx-lm @ git+https://github.com/ml-explore/mlx-lm.git@8239c72de5a0e42c539e30489021db73c7fe258c",
]

[tool.uv]
package = false
# The pinned mlx-lm revision uses legacy setup.py metadata; bind its wheel generator too.
build-constraint-dependencies = ["setuptools==83.0.0"]
